services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB1_URL: jdbc:postgresql://db1:5432/db1
      DB1_USERNAME: ${DB1_USERNAME}
      DB1_PASSWORD: ${DB1_PASSWORD}
      DB2_URL: jdbc:postgresql://db2:5432/db2
      DB2_USERNAME: ${DB2_USERNAME}
      DB2_PASSWORD: ${DB2_PASSWORD}
      DB3_URL: jdbc:postgresql://db3:5432/db3
      DB3_USERNAME: ${DB3_USERNAME}
      DB3_PASSWORD: ${DB3_PASSWORD}
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy
      db3:
        condition: service_healthy

  db1:
    image: postgres:16
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: db1
      POSTGRES_USER: ${DB1_USERNAME}
      POSTGRES_PASSWORD: ${DB1_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB1_USERNAME} -d db1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db2:
    image: postgres:16
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: db2
      POSTGRES_USER: ${DB2_USERNAME}
      POSTGRES_PASSWORD: ${DB2_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB2_USERNAME} -d db2"]
      interval: 5s
      timeout: 5s
      retries: 5

  db3:
    image: postgres:16
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: db3
      POSTGRES_USER: ${DB3_USERNAME}
      POSTGRES_PASSWORD: ${DB3_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB3_USERNAME} -d db3"]
      interval: 5s
      timeout: 5s
      retries: 5
